name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: auth-service/.nvmrc
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          # Dummy values: src/config/env.js fails fast without them and CI has no .env
          JWT_SECRET: ci-test-secret
          STAFF_USERNAME: ci-staff
          STAFF_PASSWORD: ci-staff-password
